name: "SEO ajanı: yayın kapısı"

# SEO-GEO ajanı (PlusDijital/seo-geo-ajani, Claude bulut görevi) içeriği claude/ajan-<slug> dalına gönderir.
# Bu iş akışı ajandan bağımsız olarak kuralları yeniden kontrol eder; geçerse main'e birleştirir ve
# Cloudflare Worker'a yayınlar. Geçmezse hiçbir şey yayınlanmaz, dal claude/taslak-* olur ve issue açılır.
# Zamanlanmış çalıştığı için her zaman main'deki koddan çalışır; ajan dalları bu kapıyı değiştiremez.
#
# Durdurmak için: Settings > Secrets and variables > Actions > Variables > SEO_AJANI_DURDUR = 1
# Gerekli secret: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + Zone: Workers Routes: Edit)

on:
  schedule:
    - cron: "20 5-19/2 * * *" # her gün 08:20-22:20 (Türkiye) arası 2 saatte bir
  workflow_dispatch:

concurrency:
  group: ajan-kapi
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  kapi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bekleyen dal var mı
        id: dal
        run: |
          if git ls-remote --heads origin 'claude/ajan-*' 'claude/taslak-*' | grep -q .; then echo "var=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.dal.outputs.var == '1'
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        if: steps.dal.outputs.var == '1'
        run: npm ci

      - name: Yayın kapısı
        id: kapi
        if: steps.dal.outputs.var == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SEO_AJANI_DURDUR: ${{ vars.SEO_AJANI_DURDUR }}
          SEO_AJANI_HAFTALIK: ${{ vars.SEO_AJANI_HAFTALIK }}
          KAPI_YENI: '^content/ajan/[a-z0-9-]+\.json$'
          KAPI_DEGISIM: '^content/ajan/[a-z0-9-]+\.json$'
          KAPI_ICERIK: '^content/ajan/[a-z0-9-]+\.json$'
          KAPI_KONTROL: node scripts/ajan-kontrol.mjs
          KAPI_DERLE: npm run build
        # Script, dal birleştirilirken kendi dosyası değişmesin diye geçici kopyadan çalışır.
        run: |
          cp scripts/ajan-kapi.sh "$RUNNER_TEMP/kapi.sh"
          bash "$RUNNER_TEMP/kapi.sh"

      - name: Cloudflare Worker'a yayınla
        if: steps.kapi.outputs.yayinla == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6e2fdbb8022e239aa0db1c01f53fcfda
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN secret'ı yok; main güncellendi ama yayın yapılmadı."; exit 1; fi
          git checkout -q main && git reset -q --hard origin/main
          npm run deploy
          sleep 20
          curl -fsS -o /dev/null https://serdivanreklamajansi.com/ && curl -fsS https://serdivanreklamajansi.com/robots.txt | grep -q "Allow: /"
